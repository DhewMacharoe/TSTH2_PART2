name: Auto Deploy to cPanel Subdomains

on:
  push:
    branches:
      - main

jobs:
  deploy-pengunjung:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy pengunjung
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./pengunjung/
          server-dir: /pengunjung.tsth2.id/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env

  deploy-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy catalog
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./katalog/
          server-dir: /catalog.tsth2.id/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env

  deploy-logbook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy logbook
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./logbook/
          server-dir: /logbook.tsth2.id/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env

  deploy-gudang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy gudang
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./warehouse/
          server-dir: /gudang.tsth2.id/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env